name: Security and tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 8 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        if: matrix.language == 'java-kotlin'
        with:
          cache-provider: basic
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Test and build backend under CodeQL
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process clean test buildPlugin
      - name: Test and build frontend under CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: frontend-plugin
        run: ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process clean test buildPlugin
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4

  dependencies:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      matrix:
        project: ['.', 'frontend-plugin']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          build-root-directory: ${{ matrix.project }}
          cache-provider: basic
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
